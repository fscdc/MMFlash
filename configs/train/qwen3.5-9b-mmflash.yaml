# MMFlash draft for Qwen/Qwen3.5-9B.
#
# Online disaggregated training on one 4-GPU node: an SGLang capture server on GPU 0 runs the frozen target and
# streams its hidden states (and, for MMFlash, the per-token visual-dependence score) through Mooncake to the trainer
# processes on GPUs 1-3. `specforge train` starts and supervises all of them (deployment.disaggregated.managed_local).
#
#   specforge train --config configs/train/qwen3.5-9b-mmflash.yaml
#
# Set data.train_data_path to the target-regenerated training set (scripts/regenerate.sh) and data.visual_score_path to
# its visual-dependence sidecar (scripts/score_visual_kl.sh).
model:
  target_model_path: "Qwen/Qwen3.5-9B"
  draft_model_config: "configs/qwen3.5-9b-mmflash.json"
  target_backend: sglang
  # image+text capture through the multimodal server input adapter (needs a vision-language target)
  input_modality: image
  trust_remote_code: true
  # vision-language checkpoints nest the text stack under model.language_model.*
  embedding_key: "model.language_model.embed_tokens.weight"
  lm_head_key: "lm_head.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "data/regen/qwen3.5-9b.jsonl"
  # per-token visual dependence of every response token (scripts/score_visual_kl.py), keyed by the row id
  visual_score_path: "data/visual_kl/qwen3.5-9b"
  visual_score_transform: "quantile"
  # g = transform(KL) * exp(-entropy): high only where the image both changes and settles the target's prediction
  visual_score_confidence_gate: true
  max_length: 4096
  chat_template: "qwen3.5"
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "mmflash"
  loss_type: "mmflash"
  # base weight of token k: prefix confidence prod_{i<=k} ((1 - s) * p_i + s), s = mmflash_smoothing
  mmflash_smoothing: 0.5
  # every weight is scaled by 1 + visual_alpha * g_k * (1 - p_k); 0 turns the visual term off
  visual_alpha: 1.0
  num_epochs: 6
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 10000
  log_interval: 50
  dist_timeout: 30
  seed: 42
tracking:
  report_to: "tensorboard"
run_id: "qwen3.5-9b-mmflash"
output_dir: "outputs/qwen3.5-9b-mmflash"
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 3   # = the number of trainer GPUs below
  disaggregated:
    control_dir: "outputs/qwen3.5-9b-mmflash/control"
    consumer_state_dir: "outputs/qwen3.5-9b-mmflash/consumer-state"
    backend: mooncake
    managed_local:
      # trainer GPUs, disjoint from the capture server's
      trainer_cuda_visible_devices: ["1", "2", "3"]
      mooncake:
        protocol: tcp
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["0"]
          tp_size: 1
          mem_fraction_static: 0.80
